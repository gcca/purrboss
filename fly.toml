app = 'purrboss'
primary_region = 'ord'

[build]
  image = 'ghcr.io/gcca/purrboss:latest'

[env]
  PURRBOSS_DBPATH = '/app/data/purrboss.db'
  PURRBOSS_PORT = '50051'
  TZ = 'UTC'
  PURRBOSS_DEFAULT_TTL_SECONDS = '2592000'

[[mounts]]
  source = 'purrboss_data'
  destination = '/app/data'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
  cpus = 1

[checks]
  [checks.alive]
    type = 'tcp'
    port = 50051
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
